<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Demo 会员系统 - 登录</title>
<meta name="description" content="会员登录页">
<style>
  body { font-family: sans-serif; margin: 0; background: #f5f5f5; }
  nav { background: #2c3e50; padding: 12px 24px; }
  nav a { color: #fff; margin-right: 20px; text-decoration: none; }
  .card { background: #fff; margin: 24px auto; padding: 20px; border-radius: 8px; max-width: 400px; }
  input { display: block; width: 90%; margin: 8px 0; padding: 8px; }
</style>
</head>
<body>
<nav>
  <a href="index.html">首页</a>
  <a href="ranking.html">排行榜</a>
  <a href="login.html">登录</a>
  <a href="register.html">注册</a>
</nav>
<div class="card">
  <h1>会员登录</h1>
  <form action="index.html" method="get">
    <label>用户名</label>
    <input type="text" name="username" placeholder="请输入用户名" required>
    <label>密码</label>
    <input type="password" name="password" placeholder="请输入密码" required>
    <label><input type="checkbox" name="remember" value="1"> 记住我</label>
    <button type="submit">登录</button>
  </form>
  <a href="register.html">忘记密码？去注册</a>
</div>
</body>
</html>
